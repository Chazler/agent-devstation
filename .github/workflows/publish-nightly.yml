name: Publish nightly image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: false
  queue: max

env:
  IMAGE: ghcr.io/lucurlings/agent-devstation
  SOURCE_SHA: ${{ github.sha }}
  SOURCE_RUN_NUMBER: ${{ github.run_number }}

jobs:
  image-versions:
    if: github.repository == 'LucUrlings/agent-devstation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      codex: ${{ steps.resolve.outputs.codex }}
      claude: ${{ steps.resolve.outputs.claude }}
      gh: ${{ steps.resolve.outputs.gh }}
      uv: ${{ steps.resolve.outputs.uv }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
      - id: resolve
        run: bash scripts/resolve-image-versions.sh >> "$GITHUB_OUTPUT"

  build:
    if: github.repository == 'LucUrlings/agent-devstation' && github.ref == 'refs/heads/main'
    needs: image-versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: docker/setup-buildx-action@v4
      - name: Load bubblewrap AppArmor profile
        run: |
          test -f /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          # Refresh the Ubuntu base and every package installation when publishing.
          pull: true
          no-cache: true
          tags: ${{ env.IMAGE }}:nightly-${{ env.SOURCE_SHA }}-${{ matrix.arch }}
          build-args: |
            CODEX_VERSION=${{ needs.image-versions.outputs.codex }}
            CLAUDE_VERSION=${{ needs.image-versions.outputs.claude }}
            GH_VERSION=${{ needs.image-versions.outputs.gh }}
            UV_VERSION=${{ needs.image-versions.outputs.uv }}
          cache-to: type=gha,scope=agent-devstation-${{ matrix.arch }},mode=min,ignore-error=true
      - name: Smoke-test the pushed architecture image
        run: |
          image="${IMAGE}:nightly-${SOURCE_SHA}-${{ matrix.arch }}"
          docker pull "$image"
          IMAGE="$image" bash tests/smoke.sh

  manifest:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify nightly multi-platform tags
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:nightly-${SOURCE_SHA}" \
            --annotation "index:io.github.lucurlings.agent-devstation.publish-run-number=${SOURCE_RUN_NUMBER}" \
            "${IMAGE}:nightly-${SOURCE_SHA}-amd64" \
            "${IMAGE}:nightly-${SOURCE_SHA}-arm64"
          docker buildx imagetools inspect --raw "${IMAGE}:nightly-${SOURCE_SHA}" \
            | jq -e --arg run "$SOURCE_RUN_NUMBER" '([.manifests[].platform | select(.os == "linux") | .architecture] | sort) == ["amd64", "arm64"] and .annotations["io.github.lucurlings.agent-devstation.publish-run-number"] == $run'
          nightly_run=0
          if docker buildx imagetools inspect --raw "${IMAGE}:nightly" > /tmp/nightly-manifest.json 2> /tmp/nightly-inspect.err; then
            nightly_run=$(jq -r '.annotations["io.github.lucurlings.agent-devstation.publish-run-number"] // "0"' /tmp/nightly-manifest.json)
            [[ "$nightly_run" =~ ^[0-9]+$ ]] || { echo 'nightly has an invalid publish run number' >&2; exit 1; }
          elif ! grep -qi 'not found' /tmp/nightly-inspect.err; then
            cat /tmp/nightly-inspect.err >&2
            exit 1
          fi
          if (( SOURCE_RUN_NUMBER >= nightly_run )); then
            docker buildx imagetools create \
              --tag "${IMAGE}:nightly" \
              --annotation "index:io.github.lucurlings.agent-devstation.publish-run-number=${SOURCE_RUN_NUMBER}" \
              "${IMAGE}:nightly-${SOURCE_SHA}"
            docker buildx imagetools inspect --raw "${IMAGE}:nightly" \
              | jq -e --arg run "$SOURCE_RUN_NUMBER" '.annotations["io.github.lucurlings.agent-devstation.publish-run-number"] == $run'
          fi
